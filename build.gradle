plugins {
	id 'java'
	id 'idea'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.onbok'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // elasticsearch
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'

    // prometheus
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // maria db
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // jwt
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.2'

    // csv reader
    implementation 'org.apache.commons:commons-csv:1.12.0'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'
    runtimeOnly 'com.h2database:h2'

    // testcontainers for elasticsearch
    testImplementation 'org.testcontainers:testcontainers:1.19.3'
    testImplementation 'org.testcontainers:elasticsearch:1.19.3'
    testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
}

// === 테스트 소스셋 분리: Unit / Integration ===

sourceSets {
	// 단위 테스트 소스셋
	unitTest {
		java {
			srcDir 'src/test-unit/java'
		}
		resources {
			srcDir 'src/test/resources'  // test의 resources 공유
		}
		compileClasspath += main.output + test.compileClasspath
		runtimeClasspath += main.output + test.runtimeClasspath
	}

	// 통합 테스트 소스셋
	integrationTest {
		java {
			srcDir 'src/test-integration/java'
		}
		resources {
			srcDir 'src/test/resources'  // test의 resources 공유
			srcDir 'src/test-integration/resources'
		}
		compileClasspath += main.output + test.compileClasspath
		runtimeClasspath += main.output + test.runtimeClasspath
	}
}

// 단위 테스트 태스크
tasks.register('unitTest', Test) {
	description = '단위 테스트 실행 (@DataJpaTest, Mock 기반)'
	group = 'verification'
	testClassesDirs = sourceSets.unitTest.output.classesDirs
	classpath = sourceSets.unitTest.runtimeClasspath
	useJUnitPlatform()

	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}
}

// 통합 테스트 리소스 중복 허용 (test/resources와 test-integration/resources 공유)
tasks.named('processIntegrationTestResources') {
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// 통합 테스트 태스크
tasks.register('integrationTest', Test) {
	description = '통합 테스트 실행 (@SpringBootTest, 전체 컨텍스트)'
	group = 'verification'
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()

    systemProperty "spring.profiles.active", "test"

	testLogging {
		events "passed", "skipped", "failed"
		exceptionFormat "full"
	}

	// 통합 테스트는 단위 테스트 이후 실행
	shouldRunAfter unitTest
}

// 기본 test 태스크는 단위 테스트와 통합 테스트를 순차 실행
tasks.named('test') {
	description = '모든 테스트 실행 (단위 + 통합)'
	dependsOn unitTest, integrationTest
}

// check 태스크에 통합 테스트 추가
tasks.named('check') {
	dependsOn integrationTest
}

// IntelliJ IDEA가 커스텀 소스셋을 올바르게 인식하도록 설정
idea {
	module {
		testSources.from(sourceSets.unitTest.java.srcDirs)
		testSources.from(sourceSets.integrationTest.java.srcDirs)
		testResources.from(sourceSets.unitTest.resources.srcDirs)
		testResources.from(sourceSets.integrationTest.resources.srcDirs)
	}
}
