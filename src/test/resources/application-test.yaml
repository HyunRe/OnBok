# Test Configuration

spring:
  # H2 Database
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Disable Elasticsearch and OAuth2 for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  data:
    elasticsearch:
      repositories:
        enabled: false

  # OAuth2 설정 (비활성화됨)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile

          naver:
            client-id: test-naver-id
            client-secret: test-naver-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
              - profile_image
            client-name: Naver

          github:
            client-id: test-github-id
            client-secret: test-github-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - read:user
              - user:email

        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# JWT Secret
jwt:
  secret: test-jwt-secret-key-for-testing-only-minimum-256-bits-required-here
  expiration: 86400000

# Toss Payment (test values)
toss:
  payment:
    api:
      url: https://api.tosspayments.com
    client:
      key: test-toss-ck-id
    secret:
      key: test-toss-ck-secret
    success-url: http://localhost:8080/view/payments/success
    fail-url: http://localhost:8080/view/payments/failure

# Image URL Path
file:
  upload:
    path: build/test-uploads
    url-prefix: /test-images

# Logging
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE