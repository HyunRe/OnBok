# Test Configuration

spring:
  # H2 Database
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver

  # JPA/Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Disable Elasticsearch and OAuth2 for tests
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration

  data:
    elasticsearch:
      repositories:
        enabled: false

  # OAuth2 설정 (비활성화됨)
  security:
    oauth2:
      client:
    registration:
      # Google OAuth2
      google:
        client-id: 64400659451-75uj0k262u6e3bv9980c5s37htagek6e.apps.googleusercontent.com
        client-secret: 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
        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        scope:
          - email
          - profile

      # Naver OAuth2
      naver:
        client-id: wOVlrDaH7JHFPhv4naKR
        client-secret: xtHCg2xknZ
        client-authentication-method: client_secret_post
        authorization-grant-type: authorization_code
        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        scope:
          - name
          - email
          - profile_image
        client-name: Naver

      # GitHub OAuth2
      github:
        client-id: Ov23liu8uD6npbAviUIF
        client-secret: a17ecda146c8dd7e8aa0f6e47166b16ba4a4885a
        redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        scope:
          - read:user
          - user:email

    provider:
      naver:
        authorization-uri: https://nid.naver.com/oauth2.0/authorize
        token-uri: https://nid.naver.com/oauth2.0/token
        user-info-uri: https://openapi.naver.com/v1/nid/me
        user-name-attribute: response

# JWT Secret
jwt:
  secret: on_bok_secret_key_1110101010010
  expiration: 86400000

